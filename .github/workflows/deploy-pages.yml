name: Refresh and deploy BeanPulse

on:
  push:
    branches:
      - main
  workflow_dispatch:
  repository_dispatch:
    types:
      - refresh-dashboard
  schedule:
    - cron: '17 7,19 * * *'
      timezone: Europe/Dublin

permissions:
  contents: read

concurrency:
  group: beanpulse-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pages: write
    steps:
      - name: Check out BeanPulse
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Validate dashboard logic
        run: npm run verify

      - name: Refresh project data
        run: npm run data:refresh
        env:
          GITHUB_TOKEN: ${{ secrets.BEANPULSE_GITHUB_TOKEN || github.token }}
          PR_DETAIL_LIMIT: 20

      - name: Synchronize repository discovery inbox
        run: node scripts/sync-discovery-issue.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Prepare static site
        run: |
          mkdir _site
          cp index.html _site/
          cp -R assets data _site/
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
